[project]
name = "orbiterpnext_branding"
authors = [
    { name = "Orbit Solution", email = "info@orbitsolution.site" }
]
description = "OrbitERPNext Branding and Official Dark Theme"
requires-python = ">=3.10"
readme = "README.md"
version = "1.0.0"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orbiterpnext_branding*"]

[project.urls]
Homepage = "https://www.orbitsolution.site"
Repository = "https://github.com/akila20040720/orbiterpnext_branding"
